name: Playwright tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

# A new push cancels the older run of the same branch
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  # No BASE_URL / API_URL here: the framework defaults to the public Toolshop site
  # (https://practicesoftwaretesting.com and https://api.practicesoftwaretesting.com)

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # one failing browser must not stop the others
      matrix:
        include:
          - project: api
            browsers: ""
          - project: chromium
            browsers: chromium
          - project: firefox
            browsers: chromium firefox # chromium is needed by the login setup project
          - project: webkit
            browsers: chromium webkit

    steps:
      - name: Check out the framework
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        if: matrix.browsers != ''
        run: npx playwright install --with-deps ${{ matrix.browsers }}

      - name: Run the ${{ matrix.project }} tests
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload traces, screenshots and videos of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Allure report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out the framework
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the results of all jobs
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Generate the Allure report
        run: npx allure generate ./allure-results

      - name: Upload the Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

  # Optional: publishes the report as a web page. Switched on by creating a repository
  # variable named PUBLISH_REPORT with the value true.
  publish:
    name: Publish the report to GitHub Pages
    needs: report
    if: ${{ always() && vars.PUBLISH_REPORT == 'true' && needs.report.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Upload the page content
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
