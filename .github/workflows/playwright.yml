name: Playwright tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

# A new push cancels the older run of the same branch
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  BASE_URL: http://localhost:4200
  API_URL: http://localhost:8091

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Start only the services of the app's main compose file (no phpmyadmin, cron or mailcatcher)
      COMPOSE_FILE: docker-compose.yml

  strategy:
      fail-fast: false # one failing browser must not stop the others
      matrix:
        include:
          - project: api
            browsers: ""
            local_app: false # API tests keep using the public API
          - project: chromium
            browsers: chromium
            local_app: true # the public site's bot check blocks browsers on GitHub's servers
          - project: firefox
            browsers: chromium firefox # chromium is needed by the login setup project
            local_app: true
          - project: webkit
            browsers: chromium webkit
            local_app: true

    steps:
      - name: Check out the framework
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        if: matrix.browsers != ''
        run: npx playwright install --with-deps ${{ matrix.browsers }}

      # ---- Local copy of the Toolshop app (only for jobs with local_app: true) ----
      - name: Check out the Practice Software Testing application
        if: matrix.local_app
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: practice-repo

      - name: Build the application images (with retries)
        if: matrix.local_app
        working-directory: practice-repo
        run: |
          for i in 1 2 3; do
            if docker compose build; then
              exit 0
            fi
            echo "Build failed (attempt $i of 3), retrying in 30 s"
            sleep 30
          done
          echo "The application images could not be built"
          exit 1

      - name: Start the application with Docker Compose
        if: matrix.local_app
        working-directory: practice-repo
        run: |
          docker compose up -d
          docker compose ps -a

      # The "composer" service installs the PHP dependencies after startup and then exits
      - name: Wait for the PHP dependencies to be installed
        if: matrix.local_app
        working-directory: practice-repo
        run: |
          container=$(docker compose ps -a -q composer)
          if [ -z "$container" ]; then
            echo "The composer container was not found"
            docker compose ps -a
            exit 1
          fi
          code=$(timeout 600 docker wait "$container") || {
            echo "The dependency install did not finish within 10 minutes"
            docker compose logs --tail 60 composer || true
            exit 1
          }
          echo "composer exited with code $code"
          if [ "$code" != "0" ]; then
            docker compose logs --tail 80 composer
            exit 1
          fi

      - name: Create and seed the database
        if: matrix.local_app
        working-directory: practice-repo
        run: |
          for i in $(seq 1 10); do
            if docker compose exec -T laravel-api php artisan migrate:fresh --seed; then
              exit 0
            fi
            echo "Seeding failed (attempt $i of 10), retrying in 15 s"
            sleep 15
          done
          echo "Seeding failed after 10 attempts"
          echo "----- Laravel log -----"
          docker compose exec -T laravel-api sh -c 'tail -n 80 storage/logs/laravel.log' || true
          echo "----- .env and log folder -----"
          docker compose exec -T laravel-api sh -c 'ls -la .env storage/logs; grep -E "^(APP_ENV|DB_CONNECTION|DB_HOST|DB_DATABASE|DB_USERNAME)=" .env' || true
          echo "----- Database container -----"
          docker compose logs --tail 40 mariadb || true
          docker compose ps -a
          exit 1

      # Seeding runs as root and can leave files the web process cannot write (a common cause of HTTP 500)
      # - name: Make the storage folders writable and clear caches
      #   if: matrix.local_app
      #   working-directory: practice-repo
      #   run: |
      #     docker compose exec -T laravel-api sh -c 'chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true; chmod -R 777 storage bootstrap/cache || true'
      #     docker compose exec -T laravel-api php artisan optimize:clear || true

      - name: Make the storage folders writable and clear caches
        if: matrix.local_app
        working-directory: practice-repo
        run: |
          docker compose exec -T -u root laravel-api sh -c 'chmod -R 777 storage bootstrap/cache'
          docker compose exec -T laravel-api php artisan optimize:clear || true

      # The Angular container runs "npm install" and then "ng serve", which takes a few minutes
      - name: Wait for the website
        if: matrix.local_app
        working-directory: practice-repo
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4200 || true)
            if [ "$code" = "200" ]; then
              echo "The website is up"
              exit 0
            fi
            echo "Waiting for the website ($i/90), last status: $code"
            sleep 10
          done
          echo "The website did not start in 15 minutes"
          docker compose logs --tail 60 angular-ui || true
          exit 1

      - name: Check that the application answers
        if: matrix.local_app
        working-directory: practice-repo
        run: |
          code=000
          for i in $(seq 1 6); do
            code=$(curl -s -o /tmp/products.json -w '%{http_code}' http://localhost:8091/products || true)
            if [ "$code" = "200" ]; then
              echo "GET /products answered 200"
              break
            fi
            echo "GET /products answered $code (attempt $i of 6), retrying in 10 s"
            sleep 10
          done
          if [ "$code" != "200" ]; then
            echo "----- Response body -----"
            head -c 3000 /tmp/products.json || true
            echo
            echo "----- Laravel log -----"
            docker compose exec -T laravel-api sh -c 'tail -n 60 storage/logs/laravel.log' || true
            echo "----- Storage permissions -----"
            docker compose exec -T laravel-api sh -c 'ls -la storage storage/logs; id' || true
            echo "----- Web server and PHP logs -----"
            docker compose logs --tail 40 web laravel-api || true
            exit 1
          fi
          curl -fsS -X POST http://localhost:8091/users/login \
            -H 'Content-Type: application/json' \
            --data-raw '{"email":"customer@practicesoftwaretesting.com","password":"welcome01"}' > /dev/null

      # ---- Run the tests ----
      - name: Run the ${{ matrix.project }} tests
        run: npx playwright test --project=${{ matrix.project }}
        env:
          # local app for jobs with local_app: true; empty means the framework's default (public site)
          BASE_URL: ${{ matrix.local_app && 'http://localhost:4200' || '' }}
          API_URL: ${{ matrix.local_app && 'http://localhost:8091' || '' }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload traces, screenshots and videos of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Show the application logs
        if: failure() && matrix.local_app
        working-directory: practice-repo
        run: docker compose logs --tail 100

      - name: Stop the application
        if: always() && matrix.local_app
        working-directory: practice-repo
        run: docker compose down --remove-orphans

  report:
    name: Allure report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out the framework
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the results of all jobs
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Generate the Allure report
        run: npx allure generate ./allure-results

      - name: Upload the Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

  # Optional: publishes the report as a web page. Switched on by creating a repository
  # variable named PUBLISH_REPORT with the value true.
  publish:
    name: Publish the report to GitHub Pages
    needs: report
    if: ${{ always() && vars.PUBLISH_REPORT == 'true' && needs.report.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Upload the page content
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
